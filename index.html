<!DOCTYPE html>
<html lang="pl">
<title>Kasa&amp;Czas</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Kasa&Czas: kolorowy, motywujący system wyglądu. Jasny i ciemny tryb, cztery motywy, układ jak aplikacja mobilna. */
:root {
  --bg: #f4f1ff; --surface: #ffffff; --surface-2: #f0ecfd; --raised: #ffffff;
  --line: rgba(70, 45, 150, .10); --line-2: rgba(70, 45, 150, .20);
  --fg: #1c1844; --muted: #625e86; --faint: #8f8bb0;
  --accent: #6d4aff; --accent-2: #8f74ff; --accent-ink: #ffffff; --hero-a: #6d4aff; --hero-b: #ff5ca8;
  --good: #0e9f71; --warn: #d98200; --bad: #e5384f;
  --c1: #6d4aff; --c2: #ff5ca8; --c3: #12b886; --c4: #ffb020; --c5: #2f9bff; --c6: #ff7a45; --c7: #b15cff; --c8: #20c9d6;
  --shadow: 0 14px 34px -22px rgba(60, 35, 160, .55);
  --f-display: 'Nunito', 'Segoe UI', system-ui, sans-serif; --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
[data-theme="ocean"] { --bg: #edf6ff; --surface-2: #e6f1fd; --accent: #1478ff; --accent-2: #4b9bff; --hero-a: #1478ff; --hero-b: #12c2c2; --line: rgba(20, 80, 160, .11); --line-2: rgba(20, 80, 160, .22); --fg: #10284a; --muted: #51698a; --faint: #8197b3; }
[data-theme="sunset"] { --bg: #fff3ee; --surface-2: #ffe9e0; --accent: #f2542d; --accent-2: #ff8057; --hero-a: #ff6a3d; --hero-b: #ff3d8b; --line: rgba(160, 60, 30, .12); --line-2: rgba(160, 60, 30, .24); --fg: #3d1a12; --muted: #86554a; --faint: #b18b80; }
[data-theme="mint"] { --bg: #ecfaf5; --surface-2: #def5ec; --accent: #0a9f78; --accent-2: #2bc89e; --hero-a: #0fb58a; --hero-b: #2f9bff; --line: rgba(10, 100, 80, .12); --line-2: rgba(10, 100, 80, .24); --fg: #0f3a30; --muted: #4d7a6d; --faint: #85a99d; }
[data-mode="dark"] { --bg: #120f2c; --surface: #1c1842; --surface-2: #262156; --raised: #2c2766; --line: rgba(255, 255, 255, .09); --line-2: rgba(255, 255, 255, .18); --fg: #f5f3ff; --muted: #b5b0da; --faint: #7f7aab; --accent: #8f74ff; --accent-2: #b4a2ff; --good: #38d9a4; --warn: #ffc24d; --bad: #ff6b82; --shadow: 0 16px 36px -22px rgba(0, 0, 0, .8); color-scheme: dark; }
[data-mode="dark"][data-theme="ocean"] { --bg: #0a1730; --surface: #10224a; --surface-2: #163063; --raised: #1a3874; --accent: #4da0ff; --accent-2: #7dbaff; --fg: #eef5ff; --muted: #a5bbdc; --faint: #6f89b2; }
[data-mode="dark"][data-theme="sunset"] { --bg: #22101a; --surface: #321824; --surface-2: #42202f; --raised: #4d2636; --accent: #ff8057; --accent-2: #ffa585; --fg: #fff1ec; --muted: #d9aeaa; --faint: #a47880; }
[data-mode="dark"][data-theme="mint"] { --bg: #0a201c; --surface: #102f29; --surface-2: #173d36; --raised: #1c4a41; --accent: #2bc89e; --accent-2: #63dcbb; --fg: #ecfffa; --muted: #a5d1c6; --faint: #6fa396; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 15.5px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background-color: var(--bg);
  background-image: radial-gradient(700px 460px at 100% -8%, color-mix(in srgb, var(--hero-a) 16%, transparent), transparent 65%), radial-gradient(640px 460px at -8% 105%, color-mix(in srgb, var(--hero-b) 13%, transparent), transparent 62%);
  background-attachment: fixed; transition: background-color .25s, color .25s;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
button { font: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

/* ---------- układ ---------- */
.app { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 1.6rem 1.1rem 1.3rem; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 1.8rem; overflow: auto; }
.brand { display: flex; align-items: center; gap: .7rem; padding: 0 .5rem; flex-wrap: wrap; }
.logo { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 14px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: #fff; box-shadow: 0 10px 22px -10px var(--hero-a); flex: none; }
.logo .ico { width: 1.35rem; height: 1.35rem; stroke-width: 2; }
.brand b { font-family: var(--f-display); font-size: 1.45rem; font-weight: 900; letter-spacing: -0.02em; }
.brand b span { color: var(--accent); padding: 0 .05em; }
.brand small { flex-basis: 100%; color: var(--faint); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: .3rem; }
.nav a { display: flex; align-items: center; gap: .8rem; padding: .7rem .9rem; border-radius: 14px; color: var(--muted); text-decoration: none; font-weight: 700; transition: background .15s, color .15s; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: linear-gradient(135deg, var(--accent), var(--hero-b)); color: #fff; box-shadow: 0 10px 22px -12px var(--accent); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: .7rem; color: var(--faint); font-size: .76rem; line-height: 1.45; padding: 0 .2rem; }
.ico { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ei { width: 1.05em; height: 1.05em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.16em; margin-right: .4em; flex: none; }
.lvl-card { width: 100%; display: flex; flex-direction: column; gap: .5rem; padding: .9rem 1rem; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), color-mix(in srgb, var(--hero-b) 12%, var(--surface))); color: var(--fg); cursor: pointer; text-align: left; font: inherit; }
.lvl-card .row1 { display: flex; align-items: center; gap: .6rem; font-size: .9rem; }
.lvl-card small { color: var(--muted); font-size: .72rem; }
#mode-btn { display: inline-flex; align-items: center; gap: .5rem; }
#mode-btn .ico { width: 1rem; height: 1rem; }

.main { padding-block: 2.4rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 62rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
.appbar { display: none; }
.enter > * { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
.enter > *:nth-child(2) { animation-delay: .04s; } .enter > *:nth-child(3) { animation-delay: .08s; } .enter > *:nth-child(4) { animation-delay: .12s; } .enter > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .enter > *, .modal { animation: none !important; } }

.bottom { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-block: 0 8.5rem; }
  .appbar { display: flex; align-items: center; justify-content: space-between; gap: .6rem; position: sticky; top: 0; z-index: 25; padding: calc(.6rem + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) .6rem max(16px, env(safe-area-inset-left, 0px)); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 1rem calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .appbar .brand { padding: 0; flex-wrap: nowrap; gap: .55rem; }
  .appbar .logo { width: 2.1rem; height: 2.1rem; border-radius: 12px; }
  .appbar .brand b { font-size: 1.2rem; }
  .appbar-r { display: flex; align-items: center; gap: .45rem; }
  .bottom { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: end; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 30; padding: .3rem .25rem; border-radius: 26px; background: color-mix(in srgb, var(--surface) 93%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: 0 18px 40px -16px rgba(30, 15, 90, .5); }
  .bottom a, .bottom .more { display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .45rem 0; color: var(--faint); text-decoration: none; font-size: .62rem; font-weight: 800; border-radius: 16px; background: none; border: 0; cursor: pointer; }
  .bottom a[aria-current="page"], .bottom .more[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .bottom .ico { width: 1.4rem; height: 1.4rem; }
  .bottom .plus { justify-self: center; display: grid; place-items: center; width: 3.5rem; height: 3.5rem; margin-top: -1.7rem; padding: 0; border: 0; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--hero-b)); color: #fff; box-shadow: 0 14px 26px -10px var(--accent), 0 0 0 5px var(--bg); cursor: pointer; transition: transform .12s; }
  .bottom .plus:active { transform: scale(.92); }
  .bottom .plus .ico { width: 1.7rem; height: 1.7rem; stroke-width: 2.4; }
  .fab { display: none !important; }
  #modal .modal-back { align-items: flex-end; padding: 0; }
  #modal .modal { border-radius: 28px 28px 0 0; max-width: none; max-height: 90vh; animation: sheet .26s cubic-bezier(.2, .8, .2, 1) both; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #modal .modal::before { content: ''; display: block; width: 2.6rem; height: 5px; border-radius: 9px; background: var(--line-2); margin: .55rem auto 0; }
  .toast { bottom: calc(6.6rem + env(safe-area-inset-bottom, 0px)); }
}
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }

/* ---------- typografia i drobiazgi ---------- */
.eyebrow { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.head { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: flex-end; justify-content: space-between; margin-bottom: .3rem; }
.head h1 { font-size: clamp(1.9rem, 5.5vw, 2.7rem); line-height: 1.08; font-weight: 900; letter-spacing: -0.025em; }
.head .sub { color: var(--muted); margin-top: .4rem; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 1.4rem; min-width: 0; box-shadow: var(--shadow); transition: background-color .25s, border-color .2s; }
.card > h2 + * { margin-top: 1rem; }
.stack { display: flex; flex-direction: column; gap: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; }
.grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .88rem; }
.err { color: var(--bad); font-size: .9rem; padding: 0 1.5rem; font-weight: 700; }
.pos { color: var(--good); } .neg { color: var(--bad); }
dl { margin: 0; }

/* ---------- przyciski i pola ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; font-weight: 800; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); padding: .6rem 1.15rem; min-height: 2.6rem; border-radius: 999px; cursor: pointer; transition: transform .12s, filter .2s, box-shadow .2s, background .2s, border-color .2s; }
.btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--hero-b)); color: #fff; border-color: transparent; box-shadow: 0 12px 22px -12px var(--accent); }
.btn.primary:hover { filter: brightness(1.07); background: linear-gradient(135deg, var(--accent), var(--hero-b)); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.danger:hover { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn.sm { padding: .36rem .9rem; min-height: 2.2rem; font-size: .85rem; }
.btn.on { background: linear-gradient(135deg, #12b886, #38d9a4); color: #06281d; border-color: transparent; }
.btn.yes { background: linear-gradient(135deg, #12b886, #38d9a4); color: #06281d; border-color: transparent; }
.btn.yes:hover { filter: brightness(1.06); background: linear-gradient(135deg, #12b886, #38d9a4); }
.btn:disabled { opacity: .4; cursor: default; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface-2); border: 1.5px solid transparent; border-radius: 14px; padding: .65rem .9rem; width: 100%; min-width: 0; transition: border-color .15s, background .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
input::placeholder, textarea::placeholder { color: var(--faint); }
select option { background: var(--surface); color: var(--fg); }
input[type="checkbox"] { width: 1.15rem; height: 1.15rem; padding: 0; accent-color: var(--accent); flex: none; }
input[type="date"] { color-scheme: inherit; }
input[type="search"] { width: 100%; }
textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; min-height: 7rem; resize: vertical; }
@media (max-width: 760px) { input, select, textarea { font-size: 16px; } }
.field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.field label, .lbl { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.check { display: flex; align-items: center; gap: .6rem; }
.fields { display: grid; gap: .85rem; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: .45rem 1.05rem; border-radius: 999px; cursor: pointer; font-weight: 800; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 4px 12px -6px rgba(40, 20, 120, .5); }
.rng { -webkit-appearance: none; appearance: none; height: 10px; border-radius: 99px; padding: 0; border: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 35%, var(--surface-2)), color-mix(in srgb, var(--hero-b) 35%, var(--surface-2))); accent-color: var(--accent); cursor: pointer; }
.rng:focus { box-shadow: none; }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: 0 4px 12px rgba(30, 15, 90, .35); }
.rng::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); }

/* ---------- paski i pierścienie ---------- */
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #12b886, #38d9a4); transition: width .5s cubic-bezier(.2, .7, .2, 1); }
.bar i.warn { background: linear-gradient(90deg, #ffb020, #ffd166); }
.bar i.bad { background: linear-gradient(90deg, #ff4d6d, #ff8e53); }
.bar i.acc { background: linear-gradient(90deg, var(--accent), var(--hero-b)); }
.enter .bar i { transform-origin: left; animation: grow .8s cubic-bezier(.2, .7, .2, 1) .12s both; }
@keyframes grow { from { transform: scaleX(0); } }

/* ---------- karta główna (hero) ---------- */
.lead { position: relative; overflow: hidden; color: #fff; border: 0; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); box-shadow: 0 28px 50px -28px var(--hero-a); display: flex; flex-wrap: wrap; gap: 1.4rem 2.5rem; justify-content: space-between; padding: 1.7rem; }
.lead::before { content: ''; position: absolute; right: -60px; top: -70px; width: 240px; height: 240px; border-radius: 50%; background: rgba(255, 255, 255, .13); pointer-events: none; }
.lead::after { content: ''; position: absolute; left: -50px; bottom: -90px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255, 255, 255, .09); pointer-events: none; }
.lead > * { position: relative; z-index: 1; }
.lead .main-col { flex: 1 1 20rem; min-width: 0; display: flex; flex-direction: column; gap: .55rem; }
.lead .eyebrow { color: rgba(255, 255, 255, .9); }
.lead .muted, .lead .hint { color: rgba(255, 255, 255, .86); }
.lead .big { font-family: var(--f-display); font-weight: 900; font-size: clamp(3rem, 11vw, 4.8rem); line-height: 1; letter-spacing: -0.035em; margin: .3rem 0 .1rem; color: #fff; }
.big .cur { font-size: .42em; letter-spacing: 0; font-weight: 800; opacity: .85; margin-left: .06em; }
.lead .big.neg, .lead .big.neg .cur { color: #fff; }
.lead .bar { background: rgba(255, 255, 255, .28); }
.lead .bar i, .lead .bar i.acc { background: #fff; }
.lead .bar i.warn { background: #ffe08a; } .lead .bar i.bad { background: #ffd0d6; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }
.chip { display: inline-block; padding: .4rem .85rem; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid var(--line-2); font-weight: 800; font-size: .88rem; }
.lead .chip { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .32); color: #fff; }
.lead .chip.neg { background: rgba(255, 255, 255, .94); color: var(--bad); }
.lead .btn.primary { background: #fff; color: var(--accent); box-shadow: none; }
.minis { display: flex; flex-direction: column; gap: .8rem; flex: 0 1 17rem; justify-content: center; background: rgba(255, 255, 255, .15); border-radius: 20px; padding: 1rem 1.2rem; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.minis div { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid rgba(255, 255, 255, .22); padding-bottom: .7rem; }
.minis div:last-child { border-bottom: 0; padding-bottom: 0; }
.minis dt { color: rgba(255, 255, 255, .82); } .minis dd { margin: 0; font-weight: 800; text-align: right; }
.sumrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 1rem 1.5rem; margin-top: 1.2rem; }
.sumrow div { display: flex; flex-direction: column; gap: .2rem; }
.sumrow dt { color: var(--muted); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
.sumrow dd { margin: 0; font-weight: 800; }
.sumrow .v2 { font-size: 1.7rem; font-family: var(--f-display); font-weight: 900; letter-spacing: -0.02em; }
.sumrow .hint { font-weight: 600; font-size: .82rem; }
.tile { display: flex; align-items: center; justify-content: space-between; gap: 1rem; text-decoration: none; transition: border-color .15s, transform .15s; }
a.tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile-main { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
.banner { display: flex; flex-wrap: wrap; gap: .7rem 1rem; align-items: center; justify-content: space-between; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-radius: 18px; padding: .85rem 1.15rem; font-weight: 600; }

/* ---------- szybkie akcje, seria, odznaki, wnioski ---------- */
.qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
.qbtn { display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: .85rem .3rem; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--fg); font-weight: 800; font-size: .82rem; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .15s; }
.qbtn:hover { border-color: var(--accent); }

<script>
(function () {
'use strict';
var KEY = 'kasa-i-czas:v1';
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

/* ---------- dane ---------- */
function defaults() {
  return {
    v: 1, demo: false,

    fuel: { cons: 7.5, price: 6.5 },

      { id: 'goal', name: 'Cel oszczędnościowy', type: 'pct', value: 25 },

    expenses: [], income: [], routes: [], goals: [], debts: [], fixed: [], trips: {}, defH: 6, wb: null, wbo: {}, pgFrom: '', plans: [], pa: {}, closed: {}, pd: {}, fills: [], tank0: null, extra: [], wallets: [], dbtExtra: 0, dbtStrat: 'snowball'

}
function demo() {
  var s = defaults(), t = new Date();
  s.demo = true;
  s.rates = [{ from: '2000-01-01', rate: 28 }];
  var pat = { 1: 4, 2: 4, 4: 5, 5: 6, 6: 8 };
  var endS = ymd(new Date(t.getFullYear(), t.getMonth() + 1, 0));
  for (var d = new Date(t.getFullYear(), t.getMonth() - 1, 1); ymd(d) <= endS; d = addDays(d, 1)) {

    if (h) s.hours[ymd(d)] = { h: h, note: '' };
  }
  var dayOf = function (k) { return ymd(new Date(t.getFullYear(), t.getMonth(), Math.min(k, t.getDate()))); };

    { id: uid(), date: dayOf(3), amount: 45, cat: 'school', desc: 'Podręcznik' },

  s.fills = [{ id: uid(), date: dayOf(1), amount: 90, lit: round2(90 / 6.5), t: Date.now(), gf: false, note: '' }]; s.tank0 = { date: dayOf(1), lit: 10, t: 1 };
  [12, 8.5, 15, 6, 22, 9].forEach(function (a, i) { s.expenses.push({ id: uid(), date: ymd(addDays(t, -i)), amount: a, cat: 'food', desc: 'Drobne zakupy' }); });
  s.routes = [
    { id: uid(), name: 'Dojazd do dziewczyny', km: 80, perWeek: 5, round: false },
    { id: uid(), name: 'Dojazd do szkoły', km: 12, perWeek: 5, round: true }
  ];
  s.goals = [{ id: uid(), name: 'Wakacje', target: 3000, saved: 850, deadline: ymd(new Date(t.getFullYear(), t.getMonth() + 7, 1)) }];
  s.debts = [{ id: uid(), who: 'Brat', amount: 600, paid: 200, monthly: 100, rate: 0 }, { id: uid(), who: 'Karta kredytowa', amount: 3000, paid: 500, monthly: 200, rate: 19.9 }];
  return s;
}
function load() {
  try {
    var r = localStorage.getItem(KEY);
    if (r) { var o = JSON.parse(r); if (o && typeof o === 'object') return Object.assign(defaults(), o); }
  } catch (e) {}
  return demo();
}
var S = load();
function save() { S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} cloud(); }
var dbDoc = null, dbCol = null, cloudT = null;
function cloud() { if (!dbDoc) return; clearTimeout(cloudT); cloudT = setTimeout(function () { dbDoc.set({ json: JSON.stringify(S), t: S.t }).catch(function () {}); }, 800); }
function cloudInit() {
  try {
    if (!window.claude || !claude.use) return;
    Promise.all([claude.use('user'), claude.use('db')]).then(function (r) {
      if (!r[0] || !r[1]) return;
      return r[0].id().then(function (id) {
        if (!id) return;
        dbCol = r[1].collection('data/users/' + id); dbDoc = dbCol.doc('kasa');
        return dbDoc.get().then(function (s) {
          var d = s.exists ? s.data() : null;
          if (d && d.json && (d.t || 0) > (S.t || 0)) { S = Object.assign(defaults(), JSON.parse(d.json)); try { localStorage.setItem(KEY, d.json); } catch (e) {} render(); }
          else if (S.t || localStorage.getItem(KEY)) { if (!S.t) S.t = Date.now(); cloud(); }
        });
      });
    }).catch(function () {});
  } catch (e) {}
}

var ui = { view: null, cy: new Date().getFullYear(), cm: new Date().getMonth(), multi: false, sel: {}, bulkH: '8', bp: 'month', bref: new Date(), pw: new Date(), pgShown: null, sub: {}, fw: new Date(), day: null, resetAsk: false, pay: null, edit: null };
var snapJ = null, toastT = null;
function snap() { snapJ = JSON.stringify(S); try { localStorage.setItem(KEY + ':bak', snapJ); } catch (e) {} if (dbCol) dbCol.doc('bak').set({ json: snapJ, t: Date.now() }).catch(function () {}); }
function toast(msg, undo) {
  var t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-act="undo">Cofnij</button>' : '');
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.hidden = true; }, 6000);
}

/* ---------- obliczenia ---------- */
function rateAt(d) {
  var rs = S.rates.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; }), r = null;
  rs.forEach(function (x) { if (x.from <= d) r = x.rate; });
  return r === null ? (rs[0] ? rs[0].rate : 0) : r;
}
function sumRange(a, b) {
  var h = 0, p = 0, hf = 0, pf = 0, td = ymd(new Date());
  Object.keys(S.hours).forEach(function (k) { if (k >= a && k <= b) { var x = S.hours[k].h, y = x * rateAt(k); if (k <= td) { h += x; p += y; } else { hf += x; pf += y; } } });
  return { h: h, p: p, hf: hf, pf: pf };
}
function period(kind, ref) {
  var a, b, label;
  if (kind === 'week') { a = weekStart(ref); b = addDays(a, 6); label = shortD(a) + ' – ' + shortD(b); }
  else if (kind === 'month') { a = new Date(ref.getFullYear(), ref.getMonth(), 1); b = new Date(ref.getFullYear(), ref.getMonth() + 1, 0); label = monthLabel(ref.getFullYear(), ref.getMonth()); }
  else { a = new Date(ref.getFullYear(), 0, 1); b = new Date(ref.getFullYear(), 11, 31); label = String(ref.getFullYear()); }
  return { kind: kind, a: ymd(a), b: ymd(b), da: a, db: b, label: label, days: Math.round((b - a) / 864e5) + 1 };
}
function income(P) {
  var s = sumRange(P.a, P.b);
  var extra = S.income.filter(function (i) { return i.date >= P.a && i.date <= P.b; }).reduce(function (t, i) { return t + i.amount; }, 0);
  return { h: s.h, p: s.p, extra: extra, total: s.p + extra, fut: s.pf };
}
function routeKm(r) { return r.km * (r.round ? 2 : 1); }
function routeCons(r) { return r.cons > 0 ? r.cons : S.fuel.cons; }
function routeCost(r) { return routeKm(r) * routeCons(r) / 100 * S.fuel.price; }
function routeWeekly(r) { return routeCost(r) * r.perWeek; }
function fuelWeekly() { return S.routes.reduce(function (t, r) { return t + routeWeekly(r); }, 0); }
function fuelCovered(P) { return S.fills.reduce(function (s, f) { return f.gf && f.date >= P.a && f.date <= P.b ? s + f.amount : s; }, 0); }
function fuelActual(P) { return S.fills.reduce(function (s, f) { return !f.gf && f.date >= P.a && f.date <= P.b ? s + f.amount : s; }, 0); }
function fuelPlanned(P) { return S.cats.some(function (c) { return c.id === 'fuel'; }) ? fuelActual(P) : 0; }
function fxWeeks(f) { return Math.max(.1, f.unit === 'm' ? f.every * 52 / 12 : f.every); }
function fixedPlanned(P, catId) { return catId == null ? planSpent(P) : 0; }
function fixedPlannedOld(P, catId) { return S.fixed.filter(function (f) { return catId == null || f.cat === catId; }).reduce(function (t, f) { return t + f.amount * P.days / 7 / fxWeeks(f); }, 0); }
function expIn(P, catId) {
  return S.expenses.filter(function (e) { return e.date >= P.a && e.date <= P.b && (catId == null || e.cat === catId); }).reduce(function (t, e) { return t + e.amount; }, 0);
}
function spentTotal(P) { return expIn(P) + fuelPlanned(P) + fixedPlanned(P); }
function catLimit(c, P, inc) {
  if (c.type === 'pct') return inc * c.value / 100;
  if (P.kind === 'month') return c.value;
  if (P.kind === 'year') return c.value * 12;
  return c.value * 12 / 52;
}
function catSpent(c, P) { return { logged: expIn(P, c.id), planned: (c.id === 'fuel' ? fuelPlanned(P) : 0) + fixedPlanned(P, c.id) }; }
function monthsFromNow(n) { var t = new Date(); return new Date(t.getFullYear(), t.getMonth() + n, 1); }

/* ---------- wykresy ---------- */
function cw() { var el = $('#view'); return Math.max(280, Math.min(760, (el && el.clientWidth ? el.clientWidth : window.innerWidth) - 40)); }
function nice(m) {
  if (m <= 0) return 1;
  var p = Math.pow(10, Math.floor(Math.log10(m)));
  var ks = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < ks.length; i++) { if (ks[i] * p >= m) return ks[i] * p; }
  return 10 * p;
}
var gidN = 0;
function gridLines(W, pl, pr, pt, ih, mx) {
  var s = '';
  [0, .5, 1].forEach(function (f) {
    var y = pt + ih - ih * f;
    s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + num(mx * f, 0) + '</text>';
  });
  return s;
}
function bars(items, label) {
  var W = cw(), H = 190, pl = 44, pr = 8, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb, gid = 'bg' + (++gidN);
  var mx = nice(Math.max.apply(null, items.map(function (i) { return i.v; }).concat([0])));
  var n = items.length, bw = iw / n, w = Math.max(2, Math.min(bw * .56, 30)), every = Math.max(1, Math.ceil(28 / bw));
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(label) + '"><defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent-2)"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity=".5"/></linearGradient></defs>' + gridLines(W, pl, pr, pt, ih, mx);
  items.forEach(function (it, i) {
    var h = ih * it.v / mx, x = pl + i * bw + (bw - w) / 2, y = pt + ih - h;
    s += '<rect class="mark" fill="url(#' + gid + ')" x="' + x + '" y="' + y + '" width="' + w + '" height="' + Math.max(0, h) + '" rx="' + Math.min(4, w / 2) + '"><title>' + esc(it.l) + ': ' + money(it.v) + '</title></rect>';
    if (i % every === 0) s += '<text class="ax" x="' + (x + w / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(it.l) + '</text>';
  });
  return s + '</svg>';

/* ---------- Symulator spłaty długów (kula śnieżna / lawina) ---------- */
function mlab(n) { return cap(monthsFromNow(n).toLocaleDateString('pl-PL', { month: 'short', year: 'numeric' })); }

function dIdx(id) { for (var i = 0; i < S.debts.length; i++) if (S.debts[i].id === id) return i; return 0; }
function simDebts() {
  return S.debts.filter(function (d) { return d.amount - d.paid > 0.005; }).map(function (d) {
    return { id: d.id, name: d.who, bal: d.amount - d.paid, rate: (d.rate || 0) / 1200, min: d.monthly > 0 ? d.monthly : debtMonthly(d) };
  });
}
function simulate(list, extra, strat) {
  var ds = list.map(function (d) { return { id: d.id, bal: d.bal, rate: d.rate, min: d.min }; });
  var budget = ds.reduce(function (t, d) { return t + d.min; }, 0) + (extra || 0), done = {}, pays = [null], interest = 0, m = 0;
  var shot = function () { var o = {}; ds.forEach(function (d) { o[d.id] = d.bal; }); return o; };
  var bals = [shot()];
  ds.forEach(function (d) { done[d.id] = null; });
  var order = function (a, b) { return strat === 'snowball' ? a.bal - b.bal : (b.rate - a.rate) || (a.bal - b.bal); };
  while (ds.some(function (d) { return d.bal > 0.005; }) && m < 600) {
    m++;
    ds.forEach(function (d) { if (d.bal > 0.005) { var i = d.bal * d.rate; d.bal += i; interest += i; } });
    var pool = budget, pay = {};
    ds.forEach(function (d) { pay[d.id] = 0; });
    ds.forEach(function (d) { if (d.bal > 0.005) { var p = Math.min(d.min, d.bal); d.bal -= p; pool -= p; pay[d.id] += p; } });
    var pr = ds.filter(function (d) { return d.bal > 0.005; }).sort(order);
    for (var k = 0; k < pr.length && pool > 0.005; k++) { var q = Math.min(pool, pr[k].bal); pr[k].bal -= q; pool -= q; pay[pr[k].id] += q; }
    ds.forEach(function (d) { if (d.bal <= 0.005) { d.bal = 0; if (done[d.id] === null) done[d.id] = m; } });
    bals.push(shot()); pays.push(pay);
  }
  return { months: m, interest: interest, done: done, bals: bals, pays: pays, stuck: ds.some(function (d) { return d.bal > 0.005; }) };
}
function stackBars(labels, series, label) {
  var W = cw(), H = 200, pl = 44, pr = 8, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb, n = labels.length;
  var tot = labels.map(function (_, i) { return series.reduce(function (t, s) { return t + (s.v[i] || 0); }, 0); });
  var mx = nice(Math.max.apply(null, tot.concat([0]))), bw = iw / n, w = Math.max(4, Math.min(bw * .6, 34)), every = Math.max(1, Math.ceil(36 / bw));
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(label) + '">' + gridLines(W, pl, pr, pt, ih, mx);
  labels.forEach(function (l, i) {
    var x = pl + i * bw + (bw - w) / 2, y = pt + ih;
    series.forEach(function (sr) {
      var hh = ih * (sr.v[i] || 0) / mx; if (hh <= 0.2) return;
      y -= hh;
      s += '<rect class="mark" style="fill:' + sr.color + ';stroke:var(--surface);stroke-width:1" x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '"><title>' + esc(l + ' · ' + sr.name) + ': ' + money(sr.v[i]) + '</title></rect>';
    });
    if (i % every === 0) s += '<text class="ax" x="' + (x + w / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(l) + '</text>';

}
function debtSimCard() {

  h += '<p class="hint" style="margin-top:.6rem">' + (st === 'snowball' ? 'Szybkie „wygrane” i motywacja: każdy spłacony dług zwalnia ratę dla kolejnego.' : 'Najmniej odsetek: nadpłata idzie tam, gdzie oprocentowanie jest najwyższe.') + '</p>';
  h += '<div style="margin-top:1rem">' + slider('Nadpłata miesięczna ponad raty (zł)', 'dbt-extra', ex, 0, 1000, 10, 'debt-extra') + '</div>';
  if (sel.stuck) return h + '<div class="banner" style="margin-top:1rem"><span>Przy tych ratach co najmniej jeden dług się nie spłaci: brakuje raty albo jest niższa od odsetek. Ustaw ratę w długu lub dodaj nadpłatę.</span></div></section>';
  var monthly = list.reduce(function (t, x) { return t + x.min; }, 0) + ex;
  h += '<dl class="sumrow"><div><dt>Wolny od długów</dt><dd class="v2">' + esc(mlab(sel.months)) + '</dd><dd class="hint">za ' + sel.months + ' mies.</dd></div><div><dt>Odsetki do końca</dt><dd class="v2">' + money(sel.interest) + '</dd></div><div><dt>Spłacasz miesięcznie</dt><dd class="v2">' + money(monthly) + '</dd></div></dl>';
  var cmp = function (key, name, r) { return '<div class="item' + (st === key ? ' pick' : '') + '"><div class="t"><b>' + name + (st === key ? ' · wybrana' : '') + '</b><div class="hint">' + (r.stuck ? 'nie spłaci się przy tych ratach' : 'koniec: ' + esc(mlab(r.months)) + ' · ' + r.months + ' mies.') + '</div></div><span class="amt">' + (r.stuck ? '–' : money(r.interest) + ' <span class="muted">odsetek</span>') + '</span></div>'; };
  h += '<h3 style="margin-top:1.4rem">Porównanie metod</h3><div class="list" style="margin-top:.4rem">' + cmp('snowball', 'Kula śnieżna', A) + cmp('avalanche', 'Lawina', B) + '</div>';
  if (!A.stuck && !B.stuck) { var diff = A.interest - B.interest; h += '<p class="hint" style="margin-top:.6rem">' + (Math.abs(diff) < 1 ? 'Obie metody kosztują praktycznie tyle samo odsetek.' : diff > 0 ? 'Lawina zaoszczędzi około ' + money(diff) + ' na odsetkach.' : 'Kula śnieżna wypada taniej o około ' + money(-diff) + '.') + '</p>'; }
  var ord = list.slice().sort(function (a, b) { return (sel.done[a.id] || 9999) - (sel.done[b.id] || 9999); });
  h += '<h3 style="margin-top:1.4rem">Kolejność spłaty</h3><div class="list" style="margin-top:.4rem">' + ord.map(function (x, i) {
    return '<div class="item"><div class="t"><span class="dot" style="background:' + catColor(dIdx(x.id)) + '"></span><b>' + (i + 1) + '. ' + esc(x.name) + '</b><div class="hint">zostało ' + money(x.bal) + (x.rate > 0 ? ' · ' + num(x.rate * 1200) + '% rocznie' : '') + '</div></div><span class="amt">' + esc(mlab(sel.done[x.id])) + '</span></div>';
  }).join('') + '</div>';
  var step = Math.max(1, Math.ceil(sel.months / 5)), pts = [];

/* --- pola Skąd / Dokąd --- */

/* --- trasa, ocena dróg, etykiety --- */
function tcType(st, v) {
  var ref = String(st.ref || ''), cls = [];
  (st.intersections || []).forEach(function (x) { (x.classes || []).forEach(function (c) { cls.push(c); }); });
  if (/(^|;)\s*[AS]\s?\d+/i.test(ref) || cls.indexOf('motorway') >= 0) return 'e';
  if (v && v < 45) return 'm';
  if (/(^|;)\s*(DK\s?)?\d{1,2}\s*(;|$)/i.test(ref)) return 'k';
  return 'l';
}
function tcCat(ty, v) { return ty === 'e' ? 'e' : ty === 'k' ? 'k' : ty === 'm' ? 'm' : (v >= 70 ? 'k' : 'm'); }
function tcAnalyze(rt) {
  var km = { m: 0, l: 0, k: 0, e: 0 }, cat = { m: 0, k: 0, e: 0 }, inter = 0, tot = 0;
  (rt.legs || []).forEach(function (lg) { (lg.steps || []).forEach(function (st) {
    var d = (st.distance || 0) / 1000, t = st.duration || 0, v = t > 0 ? d * 1000 / t * 3.6 : 0, ty = tcType(st, v);
    km[ty] += d; cat[tcCat(ty, v)] += d; tot += d; inter += (st.intersections || []).length;
  }); });

  if (!(tot > 0)) { km.l = dist; cat.m = dist; tot = dist; }
  var fast = tot > 0 ? km.e / tot : 0, ipk = tot > 0 ? inter / tot : 0;
  return { km: km, cat: cat, tot: tot, inter: inter, ipk: ipk, fast: fast, calm: fast * 60 + Math.min(1, ipk / 5) * 40 };
}
function tcFuel(an) {
  var l = (an.cat.m * TC.rates.m + an.cat.k * TC.rates.k + an.cat.e * TC.rates.e) / 100;
  return { l: l, cost: l * TC.price, avg: an.tot > 0 ? l / an.tot * 100 : 0 };
}
function tcLabels(list) {
  var bi = 0, bd = 0, bs = 0, cmax = 0;
  list.forEach(function (r, i) { r.tags = []; if (r.dur < list[bi].dur) bi = i; if (r.dist < list[bd].dist) bd = i; if (r.an.calm < list[bs].an.calm) bs = i; if (r.an.calm > cmax) cmax = r.an.calm; });
  if (list.length === 1) { list[0].tags.push('Jedyna trasa'); return; }
  list[bi].tags.push('Najszybsza'); list[bd].tags.push('Najkrótsza');
  if (list[bs].an.calm < cmax - 0.5) list[bs].tags.push('Spokojniejsza');
}
function tcShowRoutes(raw) {
  var list = raw.map(function (rt) {
    var an = tcAnalyze(rt), dist = (rt.distance || 0) / 1000, dur = rt.duration || 0;
    return { km: dist, dist: dist, dur: dur, avg: dur > 0 ? dist / (dur / 3600) : 0, an: an, tags: [], ll: rt.geometry && rt.geometry.coordinates ? rt.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }) : null };
  });
  if (list[0].km < 0.03) { tcMsg('Punkt startu i celu jest ten sam. Wybierz dwa różne miejsca.', 'warn'); return false; }
  tcLabels(list);
  tc.routes = list; tc.act = 0;
  tcDraw(true); tcRenderRoutes(); tcRenderCalc();
  return true;
}
function tcBusy(b) { var g = tcQ('tc-go'); if (g) { g.disabled = b; g.textContent = b ? 'Liczę…' : 'Wyznacz trasę'; } }
function tcRoute() {
  if (tc.busy) return;
  tcCloseSug(); clearTimeout(tc.dt.from); clearTimeout(tc.dt.to);
  if (!tcEl('from').value.trim() || !tcEl('to').value.trim()) { tcMsg('Wpisz oba miejsca: Skąd i Dokąd (albo ustaw je na mapie).', 'warn'); return; }
  tc.busy = true; tcBusy(true); tcMsg('Szukam miejsc i trasy…', 'info');
  tcResolve('from').then(function (a) { return tcResolve('to').then(function (b) { return [a, b]; }); }).then(function (p) {
    if (tcHav(p[0], p[1]) < 30) throw tcKind('same');
    var url = 'https://router.project-osrm.org/route/v1/driving/' + p[0].lon + ',' + p[0].lat + ';' + p[1].lon + ',' + p[1].lat + '?alternatives=true&overview=full&steps=true&geometries=geojson';
    return tcFetch(url, 25000, 'OSRM').then(function (j) {
      if (!j || j.code !== 'Ok' || !j.routes || !j.routes.length) throw tcKind('noroute');
      return j.routes;
    }, function (e) { if (e.kind === 'http' && e.body && /^No(Route|Segment)/.test(e.body.code || '')) throw tcKind('noroute'); throw e; });
  }).then(function (routes) { if (tcShowRoutes(routes)) tcMsg(''); })
    .catch(function (e) { tcMsg(tcErrMsg(e), 'bad'); if (/^(net|timeout|offline|http)$/.test(e.kind)) tcOpenManual(); })

}

}

}

      '<span class="tc-split" aria-hidden="true">' + segs + '</span><span class="tc-rt-s">Drogi: ' + shares + ' · skrzyżowań ' + tcF(r.an.ipk, 1) + ' na km</span>' +

  }).join('') + '</div><div class="tc-total"><div><span>Zużycie</span><b>' + tcF(f.l, 2) + ' l</b></div><div><span>Koszt</span><b>' + money(f.cost) + '</b></div><div><span>Średnio</span><b>' + tcF(f.avg, 1) + ' l/100 km</b></div></div>' +

    var rows = ['data;kwota;kategoria;opis'].concat(S.expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (e) { var c = byId(S.cats, e.cat); return [e.date, String(e.amount).replace('.', ','), safe(c ? c.name : ''), safe(e.desc || '')].map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(';'); }));
    dlFile('wydatki-' + ymd(new Date()) + '.csv', '﻿' + rows.join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
    toast('Pobrano wydatki do CSV (' + S.expenses.length + ').');
  },
  'json-dl': function () { dlFile('kasa-i-czas-kopia-' + ymd(new Date()) + '.json', JSON.stringify(S, null, 2), 'application/json;charset=utf-8'); toast('Pobrano kopię zapasową.'); },
  'mode-quick': function () { S.mode = effMode() === 'dark' ? 'light' : 'dark'; save(); quiet(); render(); },
  'strategy': function (el) { S.dbtStrat = el.dataset.s === 'avalanche' ? 'avalanche' : 'snowball'; save(); quiet(); render(); },
  'subtab': function (el) { ui.sub[curView()] = +el.dataset.i; render(); enter(); },
  'theme': function (el) { S.theme = el.dataset.t; save(); render(); },
  'anim-toggle': function () { S.noAnim = !S.noAnim; save(); render(); },
  'ex-add': function () { openExtra(); },
  'ex-save': function () {
    var km = parseNum(v('ex-kmn'));
    if (!(km > 0)) { merr('Ustaw, ile km w jedną stronę.'); return; }
    S.extra.push({ id: uid(), date: v('ex-date'), name: v('ex-name').trim() || 'Dodatkowa trasa', km: km, round: v('ex-rt') === '1' });
    commit();
  },
  'ex-del': function (el) { snap(); S.extra = S.extra.filter(function (x) { return x.id !== el.dataset.id; }); save(); render(); toast('Usunięto trasę.', true); },
  'fill-add': function () { openFill(); },
  'tank0-open': function () { openTank0(); },
  'tank0-set': function (el) { S.tank0 = { date: ymd(new Date()), lit: +el.dataset.l, t: Date.now() }; commit(); },
  'tank0-save': function () { S.tank0 = { date: ymd(new Date()), lit: Math.max(0, parseNum(v('tk-ln')) || 0), t: Date.now() }; commit(); },
  'fill-edit': function (el) { openFill(el.dataset.id); },
  'fill-save': function () {
    var a = round2(parseNum(v('fl-amtn'))), gf = v('fl-by') === 'gf', note = v('fl-note').trim(), dt = v('fl-date') || ymd(new Date());
    if (a <= 0) { merr('Wpisz kwotę większą od zera.'); return; }
    if (ui.edit) { var f = S.fills.filter(function (z) { return z.id === ui.edit; })[0]; if (f) { if (f.amount !== a) f.lit = round2(a / (S.fuel.price || 1)); f.amount = a; f.gf = gf; f.note = note; f.date = dt; } }
    else S.fills.push({ id: uid(), date: dt, amount: a, lit: round2(a / (S.fuel.price || 1)), t: Date.now(), gf: gf, note: note });
    commit();
  },
  'fill-del': function (el) { snap(); S.fills = S.fills.filter(function (x) { return x.id !== el.dataset.id; }); save(); render(); toast('Usunięto tankowanie.', true); },
  'wb-auto': function () { S.wbAuto = !S.wbAuto; if (S.wbAuto && !S.pgFrom) S.pgFrom = ymd(weekStart(new Date())); save(); render(); },
  'bw-prev': function () { ui.bp = 'week'; ui.bref = addDays(ui.bref, -7); render(); },
  'bw-next': function () { ui.bp = 'week'; ui.bref = addDays(ui.bref, 7); render(); },
  'wb-reset': function (el) { delete S.wbo[el.dataset.w]; save(); render(); },
  'work-yes': function () { var o = S.hours[ui.day]; S.hours[ui.day] = { h: o && o.h > 0 ? o.h : S.defH, note: o ? o.note : '' }; commit(); },
  'work-no': function () { var o = S.hours[ui.day]; if (o && o.note) S.hours[ui.day] = { h: 0, note: o.note }; else delete S.hours[ui.day]; commit(); },
  trip: function (el) { var d = el.dataset.d, id = el.dataset.r, t = S.trips[d] || [], i = t.indexOf(id); if (i >= 0) t.splice(i, 1); else t.push(id); if (t.length) S.trips[d] = t; else delete S.trips[d]; save(); render(); },
  'fw-prev': function () { ui.fw = addDays(ui.fw, -7); render(); },
  'fw-next': function () { ui.fw = addDays(ui.fw, 7); render(); },
  'fx-add': function () { openFixed(null); },
  'fx-edit': function (el) { openFixed(el.dataset.id); },
  'fx-save': function () {
    var n = v('f-name').trim(), pr = round2(parseNum(v('f-pricen'))), ev = parseNum(v('f-evn'));
    if (!n) { merr('Podaj nazwę.'); return; }
    if (pr <= 0 || ev <= 0) { merr('Ustaw cenę i co ile tygodni kupujesz.'); return; }
    var r = { name: n, price: pr, every: ev, wk: round2(pr / ev), goal: pr };
    if (ui.edit) Object.assign(byId(S.fixed, ui.edit), r); else { r.id = uid(); S.fixed.push(r); }
    commit();
  },
  'fx-del': function (el) { snap(); S.fixed = S.fixed.filter(function (f) { return f.id !== el.dataset.id; }); purge(el.dataset.id); save(); render(); toast('Usunięto stały wydatek.', true); },
  'bp-set': function (el) { ui.bp = el.dataset.k; render(); },
  'bp-prev': function () { bpMove(-1); },
  'bp-next': function () { bpMove(1); },
  'exp-add': function () { openExpense(null); },
  'exp-edit': function (el) { openExpense(el.dataset.id); },
  'exp-save': function () {
    var amt = parseNum(v('x-amt')), date = v('x-date');
    if (amt <= 0) { merr('Wpisz kwotę większą od zera.'); return; }
    if (!date) { merr('Wybierz datę.'); return; }
    var rec = { date: date, amount: round2(amt), cat: v('x-cat'), desc: v('x-desc').trim(), w: v('x-w') || null };
    if (rec.cat === 'fuel' && !ui.edit) { S.fills.push({ id: uid(), date: rec.date, amount: rec.amount, lit: round2(rec.amount / (S.fuel.price || 1)), t: Date.now(), gf: false, note: rec.desc }); }
    else if (ui.edit) { Object.assign(byId(S.expenses, ui.edit), rec); } else { rec.id = uid(); S.expenses.push(rec); }
    commit();
  },
  'exp-del': function (el) { snap(); S.expenses = S.expenses.filter(function (e) { return e.id !== el.dataset.id; }); save(); render(); toast('Usunięto wydatek.', true); },
  'inc-add': openIncome,
  'inc-save': function () {
    var amt = parseNum(v('i-amt')), date = v('i-date');
    if (amt <= 0) { merr('Wpisz kwotę większą od zera.'); return; }
    if (!date) { merr('Wybierz datę.'); return; }
    S.income.push({ id: uid(), date: date, amount: round2(amt), desc: v('i-desc').trim() }); commit();
  },
  'inc-del': function (el) { snap(); S.income = S.income.filter(function (e) { return e.id !== el.dataset.id; }); save(); render(); toast('Usunięto przychód.', true); },
  'cat-add': function () { snap(); S.cats.push({ id: 'c' + uid(), name: 'Nowa kategoria', type: 'pct', value: 0 }); save(); render(); },
  'cat-del': function (el) {
    var id = el.dataset.id, rest = S.cats.filter(function (c) { return c.id !== id; });
    snap();
    var to = rest.filter(function (c) { return c.id === 'other'; })[0] || rest[0];
    S.expenses.forEach(function (e) { if (e.cat === id && to) e.cat = to.id; });
    S.cats = rest; save(); render(); toast('Usunięto kategorię. Jej wydatki trafiły do „' + (to ? to.name : 'brak') + '”.', true);
  },
  'route-add': function () { openRoute(null); },
  'route-edit': function (el) { openRoute(el.dataset.id); },
  'route-save': function () {
    var r = routeRead();
    if (!r.name) { merr('Podaj nazwę trasy.'); return; }
    if (r.km <= 0) { merr('Dystans musi być większy od zera.'); return; }
    if (r.perWeek <= 0) { merr('Liczba przejazdów musi być większa od zera.'); return; }
    var fc = !ui.edit && ui.fromCalc; ui.fromCalc = false;
    if (ui.edit) Object.assign(byId(S.routes, ui.edit), r); else { r.id = uid(); S.routes.push(r); }
    commit(fc ? 'Dodano trasę do listy Trasy.' : undefined);
  },
  'route-del': function (el) { snap(); S.routes = S.routes.filter(function (r) { return r.id !== el.dataset.id; }); save(); render(); toast('Usunięto trasę.', true); },
  'goal-add': function () { openGoal(null); },
  'goal-edit': function (el) { openGoal(el.dataset.id); },
  'goal-save': function () {
    var name = v('g-name').trim(), t = parseNum(v('g-target')), s = parseNum(v('g-saved')), d = v('g-dead');
    if (!name) { merr('Podaj nazwę celu.'); return; }
    if (t <= 0) { merr('Kwota docelowa musi być większa od zera.'); return; }
    if (!d) { merr('Wybierz termin.'); return; }
    var rec = { name: name, target: round2(t), saved: round2(s), deadline: d };
    if (ui.edit) Object.assign(byId(S.goals, ui.edit), rec); else { rec.id = uid(); S.goals.push(rec); }
    commit();
  },
  'goal-del': function (el) { snap(); S.goals = S.goals.filter(function (g) { return g.id !== el.dataset.id; }); save(); render(); toast('Usunięto cel.', true); },
  'goal-pay': function (el) { openPay('goal', el.dataset.id); },
  'debt-add': function () { openDebt(null); },
  'debt-edit': function (el) { openDebt(el.dataset.id); },
  'debt-save': function () {
    var who = v('d-who').trim(), a = parseNum(v('d-amt')), p = parseNum(v('d-paid')), m = parseNum(v('d-mon'));
    if (!who) { merr('Podaj, komu jesteś winien.'); return; }
    if (a <= 0) { merr('Kwota długu musi być większa od zera.'); return; }
    var rec = { who: who, amount: round2(a), paid: round2(p), monthly: round2(m), rate: Math.max(0, round2(parseNum(v('d-rate')))), due: v('d-due') || null };
    if (ui.edit) Object.assign(byId(S.debts, ui.edit), rec); else { rec.id = uid(); S.debts.push(rec); }
    commit();
  },
  'debt-del': function (el) { snap(); S.debts = S.debts.filter(function (d) { return d.id !== el.dataset.id; }); save(); render(); toast('Usunięto dług.', true); },
  'debt-pay': function (el) { openPay('debt', el.dataset.id); },
  'pay-save': function () {
    var amt = parseNum(v('p-amt')), p = ui.pay;
    if (amt <= 0) { merr('Wpisz kwotę większą od zera.'); return; }
    if (p.kind === 'goal') { var g = byId(S.goals, p.id); g.saved = round2(g.saved + amt); }
    else { var d = byId(S.debts, p.id); d.paid = round2(Math.min(d.amount, d.paid + amt)); }
    if (chk('p-log')) S.expenses.push({ id: uid(), date: ymd(new Date()), amount: round2(amt), cat: p.kind, desc: p.kind === 'goal' ? 'Wpłata na cel: ' + byId(S.goals, p.id).name : 'Spłata: ' + byId(S.debts, p.id).who });
    commit('Zapisano wpłatę.');
  },
  'rate-add': function () {
    var from = v('n-from'), r = parseNum(v('n-rate'));
    if (!from || r <= 0) { toast('Podaj datę i stawkę większą od zera.'); return; }
    snap();
    S.rates = S.rates.filter(function (x) { return x.from !== from; }); S.rates.push({ from: from, rate: round2(r) });
    save(); render(); toast('Dodano stawkę.', true);
  },
  'rate-del': function (el) { snap(); S.rates.splice(+el.dataset.i, 1); save(); render(); toast('Usunięto stawkę.', true); },
  'copy-json': function () {
    var ta = $('#exp-json'), txt = JSON.stringify(S);
    var fb = function () { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Skopiowano dane.'); } catch (e) { toast('Zaznacz tekst w polu i skopiuj ręcznie.'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Skopiowano dane.'); }, fb); else fb();
  },
  'import-json': function () { importText(v('imp-json')); },
  'reset-ask': function () { ui.resetAsk = true; render(); },
  'reset-no': function () { ui.resetAsk = false; render(); },
  'reset-do': function () { snap(); S = defaults(); ui.resetAsk = false; ui.sel = {}; save(); render(); toast('Dane usunięte. Zacznij od ustawienia stawki.', true); },
  'load-demo': function () { snap(); S = demo(); save(); render(); toast('Wczytano dane przykładowe.', true); }
};
function bpMove(dir) {
  var r = ui.bref;
  if (ui.bp === 'week') ui.bref = addDays(r, 7 * dir);
  else if (ui.bp === 'month') ui.bref = new Date(r.getFullYear(), r.getMonth() + dir, 1);
  else ui.bref = new Date(r.getFullYear() + dir, 0, 1);
  render();
}
function importText(txt) {
  try {
    var o = JSON.parse(txt);
    if (looksBudzet(o)) {
      snap(); if (S.demo) S = defaults();
      var n = fromBudzet(o); save(); render();
      toast('Z budzet.html wczytano: wydatki ' + n.exp + ', tankowania ' + n.fill + ', długi ' + n.debt + ', cele ' + n.goal + '.', true);
      return;
    }
    if (!o || typeof o !== 'object' || !o.hours || !o.cats) throw new Error('bad');
    snap(); S = Object.assign(defaults(), o, { demo: false }); save(); render(); toast('Wczytano dane.', true);
  } catch (e) { toast('To nie wygląda na kopię zapasową Kasa&Czas ani budzet.html.'); }
}
var CHG = {
  'debt-extra': function (el) { S.dbtExtra = Math.max(0, parseNum(el.value)); save(); quiet(); render(); },
  'cat-name': function (el) { var c = byId(S.cats, el.dataset.id); if (c) { c.name = el.value.trim() || c.name; save(); render(); } },
  'cat-type': function (el) { var c = byId(S.cats, el.dataset.id); if (c) { c.type = el.value; save(); render(); } },
  'cat-value': function (el) { var c = byId(S.cats, el.dataset.id); if (c) { c.value = Math.max(0, parseNum(el.value)); save(); render(); } },
  'fuel-cons': function (el) { var n = parseNum(el.value); if (n > 0) S.fuel.cons = n; save(); render(); },
  'fuel-price': function (el) { var n = parseNum(el.value); if (n > 0) S.fuel.price = n; save(); render(); },
  'wb-def': function (el) { var e = el.value.trim() === ''; S.wb = e ? null : Math.max(0, parseNum(el.value)); if (!e && !S.pgFrom) S.pgFrom = ymd(weekStart(new Date())); save(); render(); },
  'wb-wk': function (el) { var w = el.dataset.w; if (el.value.trim() === '') delete S.wbo[w]; else { S.wbo[w] = Math.max(0, parseNum(el.value)); if (!S.pgFrom || w < S.pgFrom) S.pgFrom = w; } save(); render(); },
  'pa-set': function (el) { var k = el.dataset.k; if (el.value.trim() === '') delete S.pa[k]; else S.pa[k] = Math.max(0, parseNum(el.value)); save(); render(); },
  'open-set': function (el) { S.open = Math.max(0, parseNum(el.value) || 0); save(); render(); },
  'fuel-tank': function (el) { var n = parseNum(el.value); if (n > 0) S.fuel.tank = n; save(); render(); },
  'def-h': function (el) { var n = parseNum(el.value); if (n > 0 && n <= 24) S.defH = n; save(); render(); },
  'rate-edit': function (el) { var n = parseNum(el.value); if (n >= 0 && S.rates[+el.dataset.i]) S.rates[+el.dataset.i].rate = n; save(); render(); },
  'file-import': function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    var rd = new FileReader(); rd.onload = function () { importText(String(rd.result)); }; rd.readAsText(f);
  }
};

document.addEventListener('click', function (e) {
  if (e.target.classList && e.target.classList.contains('modal-back')) { closeModal(); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('change', function (e) {
  var el = e.target.closest ? e.target.closest('[data-change]') : null;
  if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el);
});
document.addEventListener('input', function (e) {
  var el = e.target.closest ? e.target.closest('[data-live]') : null;
  if (el && LIVE[el.dataset.live]) LIVE[el.dataset.live]();
  if (e.target.id === 'bulk-h') ui.bulkH = e.target.value;
  if (e.target.id === 'exp-q') { ui.q = e.target.value; filterExp(); }
  var pr = e.target.dataset && e.target.dataset.pair;
  if (pr) { var o = document.getElementById(pr); if (o) o.value = e.target.type === 'range' ? String(+e.target.value).replace('.', ',') : parseNum(e.target.value); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'csv-in' && e.target.files && e.target.files[0]) { var r = new FileReader(), inp = e.target; r.onload = function () { importCsv(String(r.result)); inp.value = ''; }; r.readAsText(inp.files[0]); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('#modal').innerHTML) closeModal();
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest && e.target.closest('.modal')) {
    var p = $('.modal [data-primary]'); if (p) { e.preventDefault(); p.click(); }
  }
});
window.addEventListener('hashchange', function () { var h = ''; try { h = location.hash.slice(1); } catch (e) {} if (VIEWS[h] && h !== ui.view) go(h); });
var lastW = window.innerWidth, rt = null;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () { if (Math.abs(window.innerWidth - lastW) > 24 && !$('#modal').innerHTML) { lastW = window.innerWidth; render(); } }, 200);
});

if (S.plans.some(function (p) { return p.day && !p.since; })) { S.plans.forEach(function (p) { if (p.day && !p.since) p.since = ymd(weekStart(new Date())); }); save(); }
startEmoji();
buildNav();
render();
enter();
document.body.insertAdjacentHTML('beforeend', '<button type="button" class="fab" data-act="quick-add" aria-label="Dodaj wydatek">+</button>');
setTimeout(function () { if (ui.todayShown) return; ui.todayShown = true; var k = KEY + ':today', t = ymd(new Date()), seen = ''; try { seen = localStorage.getItem(k) || ''; } catch (e) {} if (seen === t) return; try { localStorage.setItem(k, t); } catch (e) {} if (!$('#modal').innerHTML) openToday(); }, 1300);
cloudInit();
})();
</script>
